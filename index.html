<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jisun's Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root { --bg: #F1F4FF; --line: #D6DDF5; --accent: #3E5BB8; --soft: #E4E9FB; }
body { background-image: radial-gradient(#DCE3FA 1.5px, transparent 1.5px); background-size: 26px 26px; }
.hero { background: linear-gradient(180deg, #E4E9FB 0%, #FFFFFF 75%); }
.hero h1 { font-size: 36px; color: var(--accent); }
.date { font: 600 20px var(--display); margin: 0; }
.today { display: flex; flex-direction: column; gap: 12px; }
.today-h { display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: var(--accent); }
.today-n { font: 600 18px var(--display); color: var(--muted); } .today-n b { color: var(--accent); }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chip { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; text-decoration: none; color: var(--ink); background: #FFFFFF; }
.chip .c-name { font: 600 18px var(--display); }
.sticker { width: 44px; height: 44px; border-radius: 50%; border: 2px dashed var(--line); flex-shrink: 0; display: grid; place-items: center; }
.sticker.on { border: 0; transform: rotate(-10deg); animation: stick .5s ease-out; }
.sticker svg { width: 100%; height: 100%; }
@keyframes stick { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25) rotate(-6deg); } 100% { transform: scale(1) rotate(-10deg); } }
.chip.done { border-color: #F2D27A; background: #FFF8E1; }
.today.all { border-color: var(--sun); box-shadow: 0 0 0 4px #FFF3C4; }
.today.all .today-h { cursor: pointer; }
.subjects { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.subject { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; text-decoration: none; color: var(--ink); border-radius: 22px; padding: 18px 14px; border: 2px solid var(--line); background: #FFFFFF; }
.subject svg { width: 110px; height: auto; }
.subject .name { font: 600 22px var(--display); }
.subject .tag2 { font: 600 14px var(--display); border-radius: 99px; padding: 2px 12px; }
.subject .prog { font-size: 15px; color: var(--muted); margin: 0; }
.subject.amc { border-color: #D3D6F5; background: linear-gradient(180deg, #EEF0FF, #FFFFFF 60%); } .amc .tag2 { background: #E6E7FB; color: #4B4FC4; }
.subject.ss { border-color: #C4E4D1; background: linear-gradient(180deg, #EAF7EF, #FFFFFF 60%); } .ss .tag2 { background: #DDF1E5; color: #2D7D5A; }
.subject:focus-visible, .chip:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@media (max-width: 560px), (orientation: portrait) {
  .hero h1 { font-size: clamp(28px, 8.5vw, 60px); }
  .date { font-size: clamp(17px, 4.8vw, 34px); }
  .today-h { font-size: clamp(20px, 5.8vw, 40px); }
  .today-n { font-size: clamp(16px, 4.6vw, 32px); }
  .chips, .subjects { gap: 3vw; }
  .chip { border-radius: 4vw; padding: 2.6vw 3.6vw; }
  .chip .c-name { font-size: clamp(16px, 4.6vw, 32px); }
  .sticker { width: 11vw; height: 11vw; }
  .subject { border-radius: 5vw; padding: 4vw 3vw; }
  .subject svg { width: 26vw; }
  .subject .name { font-size: clamp(19px, 5.4vw, 38px); }
  .subject .tag2 { font-size: clamp(13px, 3.6vw, 24px); }
  .subject .prog { font-size: clamp(14px, 3.8vw, 26px); }
}
@media (prefers-reduced-motion: reduce) { .sticker.on { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="card hero">
    <div class="art">
      <svg viewBox="0 0 200 200" role="img" aria-label="A planet with an orbit above an open book">
        <circle cx="100" cy="100" r="92" fill="#E4E9FB"/>
        <g fill="none" stroke="#E0A526" stroke-width="1.5" stroke-linejoin="round" opacity=".8"><path d="M36 58 L54 42 L72 54 L62 72"/></g>
        <g fill="#FFD36E"><circle cx="36" cy="58" r="3.5"/><circle cx="54" cy="42" r="4.5"/><circle cx="72" cy="54" r="3"/><circle cx="62" cy="72" r="3"/><circle cx="160" cy="44" r="3"/><circle cx="168" cy="120" r="2.5"/></g>
        <ellipse cx="108" cy="84" rx="64" ry="20" transform="rotate(-16 108 84)" fill="none" stroke="#3E5BB8" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
        <circle cx="108" cy="84" r="26" fill="#3E5BB8"/>
        <path d="M92 70 a22 22 0 0 1 22 -8" fill="none" stroke="#9FB4EE" stroke-width="4" stroke-linecap="round"/>
        <path d="M80 98 a64 20 -16 0 0 58 -8" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".6"/>
        <circle cx="166" cy="62" r="8" fill="#FFD36E" stroke="#E0A526" stroke-width="2"/>
        <path d="M44 146 q28 -12 56 0 v28 q-28 -12 -56 0z M156 146 q-28 -12 -56 0 v28 q28 -12 56 0z" fill="#FFFFFF" stroke="#3E5BB8" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M54 152 q18 -6 36 0 M54 160 q18 -6 36 0 M110 152 q18 -6 36 0 M110 160 q18 -6 36 0" fill="none" stroke="#C3CEF2" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 id="hello">Welcome back!</h1>
    <p class="date" id="date"></p>
    <p class="lead">What will you learn today?</p>
  </section>

  <section class="card today" aria-label="Today's study">
    <h2 class="today-h">Today’s Study <span class="today-n" id="todayN"></span></h2>
    <div class="chips" id="chips"></div>
  </section>

  <section class="subjects" aria-label="Subjects">
    <a class="subject amc" href="amc8.html">
      <svg viewBox="0 0 200 200" aria-hidden="true">
  <circle cx="100" cy="100" r="92" fill="#E6E7FB"/>
  <circle cx="100" cy="100" r="54" fill="#FFFFFF" stroke="#4B4FC4" stroke-width="4"/>
  <path d="M100 46 L146.8 127 L53.2 127 Z" fill="#C9CBF5" stroke="#4B4FC4" stroke-width="4" stroke-linejoin="round"/>
  <path d="M100 100 L100 46 M100 100 L146.8 127" stroke="#4B4FC4" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
  <path d="M60 40 a70 70 0 0 1 80 0" fill="none" stroke="#FFD36E" stroke-width="4" stroke-linecap="round"/>
  <g fill="#FFD36E" stroke="#4B4FC4" stroke-width="2.5"><circle cx="100" cy="46" r="6"/><circle cx="146.8" cy="127" r="6"/><circle cx="53.2" cy="127" r="6"/></g>
  <circle cx="100" cy="100" r="4" fill="#4B4FC4"/>
</svg>
      <span class="tag2">Math</span>
      <span class="name">AMC 8 Challenge</span>
      <p class="prog" id="p-amc">5 days · 25 problems</p>
    </a>
    <a class="subject ss" href="world_cultures.html">
      <svg viewBox="0 0 200 200" aria-hidden="true">
  <circle cx="100" cy="100" r="92" fill="#DDF1E5"/>
  <circle cx="100" cy="100" r="54" fill="#FFFFFF" stroke="#2D7D5A" stroke-width="4"/>
  <g fill="none" stroke="#2D7D5A" stroke-width="2.5" opacity=".75">
    <ellipse cx="100" cy="100" rx="22" ry="54"/><path d="M100 46 v108 M46 100 h108 M54 72 h92 M54 128 h92"/></g>
  <path d="M100 100 m-54 0 a54 54 0 0 0 108 0" fill="#8FD6C4" opacity=".25"/>
  <path d="M132 58 c-12 0 -20 9 -20 19 c0 14 20 32 20 32 s20 -18 20 -32 c0 -10 -8 -19 -20 -19z" fill="#FFD36E" stroke="#2D7D5A" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="132" cy="77" r="6" fill="#FFFFFF" stroke="#2D7D5A" stroke-width="2.5"/>
</svg>
      <span class="tag2">Social Studies</span>
      <span class="name">World Cultures</span>
      <p class="prog" id="p-ss">5 days · 50 questions</p>
    </a>
  </section>
</div>

<script>
const NAME = "Jisun";   // the student's name ("" = no name)
(function () {
  if (NAME) document.getElementById("hello").textContent = `Welcome back, ${NAME}!`;
  const now = new Date();
  document.getElementById("date").textContent = now.toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric", year: "numeric"});

  // Progress on each subject card
  const show = (key, id, per) => {
    try {
      const s = JSON.parse(localStorage.getItem(key)); if (!s || !s.days) return;
      const done = s.days.filter(d => d.done).length;
      if (done === s.days.length) document.getElementById(id).textContent = "All 5 days done! 🏆";
      else if (done) document.getElementById(id).textContent = `${done} of 5 days done`;
    } catch (e) {}
  };
  show("amc8-quiz-days-v1", "p-amc");
  show("world-cultures-quiz-days-v1", "p-ss");

  // Today's Study: a star sticker for each subject finished today
  const SUBJ = [["amc", "AMC 8", "amc8.html"], ["ss", "Social Studies", "world_cultures.html"]];
  const STAR = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 L25 14.5 L37.5 15.5 L28 24 L31 36.5 L20 30 L9 36.5 L12 24 L2.5 15.5 L15 14.5z" fill="#FFD36E" stroke="#E0A526" stroke-width="2" stroke-linejoin="round"/><path d="M14 16 l4 -1" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/></svg>';
  const key = "us-study-today-v1", day = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
  let s = {};
  try { s = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) {}
  const done = s.date === day && s.done ? s.done : {};
  let cnt = 0;
  document.getElementById("chips").innerHTML = SUBJ.map(([id, name, href]) => {
    const d = done[id] && done[id].length; if (d) cnt++;
    return `<a class="chip${d ? " done" : ""}" href="${href}"><span class="c-name">${name}</span><span class="sticker${d ? " on" : ""}" role="img" aria-label="${d ? "done" : "not yet"}">${d ? STAR : ""}</span></a>`;
  }).join("");
  document.getElementById("todayN").innerHTML = `<b>${cnt}</b> / ${SUBJ.length}`;

  if (cnt !== SUBJ.length) return;
  // Everything done today: stars and hearts burst like fireworks, with a cheer
  const box = document.querySelector(".today"); box.classList.add("all");
  const party = () => {
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const layer = document.createElement("div"); layer.className = "party"; document.body.appendChild(layer);
    const CHEERS = [[NAME ? `${NAME}, you rock!` : "You rock!", "All done for today!"], ["Awesome work!", "Every subject finished!"], [NAME ? `Way to go, ${NAME}!` : "Way to go!", "You crushed it today!"], ["Superstar!", "See you tomorrow!"]];
    const [c1, c2] = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    const cheer = document.createElement("div"); cheer.className = "cheer"; cheer.setAttribute("role", "status");
    cheer.innerHTML = `<b>${c1}</b><span>${c2}</span>`; layer.appendChild(cheer);
    cheer.animate(reduce ? [{opacity: 0}, {opacity: 1, offset: 0.1}, {opacity: 1, offset: 0.85}, {opacity: 0}] : [
      {transform: "translate(-50%, -50%) scale(0.3)", opacity: 0},
      {transform: "translate(-50%, -50%) scale(1.15)", opacity: 1, offset: 0.12},
      {transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.2},
      {transform: "translate(-50%, -50%) scale(1.04)", opacity: 1, offset: 0.55},
      {transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.85},
      {transform: "translate(-50%, -60%) scale(0.95)", opacity: 0}
    ], {duration: 3800, easing: "ease-out", fill: "both"});
    const COLORS = ["#3E5BB8", "#7FB3E8", "#FFD36E", "#F48BAE", "#8FD6C4", "#C7B6F2"];
    const HEART_P = "M20 35 C8 26 3 19 3 12.5 C3 7.5 7 4 11.5 4 C15 4 18 6 20 9 C22 6 25 4 28.5 4 C33 4 37 7.5 37 12.5 C37 19 32 26 20 35z";
    const STAR_P = "M20 2 L25 14 L38 15 L28 24 L31 37 L20 30 L9 37 L12 24 L2 15 L15 14z";
    const W = innerWidth, H = innerHeight, bursts = reduce ? 1 : 4, per = reduce ? 14 : 26;
    for (let b = 0; b < bursts; b++) {
      const ox = W * (0.2 + 0.6 * ((b * 0.37 + 0.5) % 1)), oy = H * (0.25 + 0.2 * (b % 2));
      for (let i = 0; i < per; i++) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const size = 20 + Math.random() * 26, color = COLORS[(i + b) % COLORS.length];
        el.setAttribute("viewBox", "0 0 40 40"); el.setAttribute("width", size); el.setAttribute("height", size);
        el.innerHTML = `<path d="${i % 3 ? STAR_P : HEART_P}" fill="${color}" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>`;
        el.style.left = ox + "px"; el.style.top = oy + "px";
        layer.appendChild(el);
        const ang = Math.random() * Math.PI * 2, dist = (reduce ? 60 : 110) + Math.random() * Math.min(W, H) * 0.35;
        const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = (Math.random() - 0.5) * 540;
        el.animate([
          {transform: "translate(-50%, -50%) scale(0) rotate(0deg)", opacity: 1},
          {transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.45},
          {transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 160}px)) scale(0.8) rotate(${rot}deg)`, opacity: 0}
        ], {duration: 1700 + Math.random() * 900, delay: b * 380, easing: "cubic-bezier(.15,.75,.35,1)", fill: "both"});
      }
    }
    setTimeout(() => layer.remove(), Math.max(bursts * 380 + 2800, 4000));
  };
  document.querySelector(".today-h").addEventListener("click", party);
  try { if (!s.party) { s.party = true; localStorage.setItem(key, JSON.stringify(s)); setTimeout(party, 400); } } catch (e) { setTimeout(party, 400); }
})();
</script>
</body>
</html>
